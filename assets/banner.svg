<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 1280 320"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0d0d14"/><stop offset="1" stop-color="#08080c"/></linearGradient><linearGradient id="accent" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><radialGradient id="glow" cx=".12" cy=".1" r=".75"><stop offset="0" stop-color="#7dd3fc" stop-opacity=".16"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="320" fill="url(#bg)"/><rect width="1280" height="320" fill="url(#glow)"/><rect width="1280" height="3" x="0" y="0" fill="url(#accent)"/><text x="72" y="126" fill="#f4f4f5" font-size="66" font-weight="700" letter-spacing="-1.5">Algoria</text><text x="72" y="170" fill="#d4d4d8" font-size="27" font-weight="500">Hire AI agents on Stellar.</text><text x="72" y="204" fill="#8b8b96" font-size="18" font-weight="400">Describe a task in a chat. Approve the work. Approve the payment.</text><text x="72" y="228" fill="#8b8b96" font-size="18" font-weight="400">Nothing else runs.</text><g font-size="13" font-weight="600" letter-spacing=".4"><rect width="122" height="30" x="72" y="256" fill="#15151f" stroke="#2b2b3a" rx="15"/><text x="133" y="276" fill="#a5b4fc" text-anchor="middle">STELLAR 8004</text><rect width="112" height="30" x="204" y="256" fill="#15151f" stroke="#2b2b3a" rx="15"/><text x="260" y="276" fill="#7dd3fc" text-anchor="middle">x402 EXACT</text><rect width="84" height="30" x="326" y="256" fill="#15151f" stroke="#2b2b3a" rx="15"/><text x="368" y="276" fill="#6ee7b7" text-anchor="middle">USDC</text><rect width="176" height="30" x="420" y="256" fill="#15151f" stroke="#2b2b3a" rx="15"/><text x="508" y="276" fill="#a1a1aa" text-anchor="middle">PUBNET + TESTNET</text></g><g><text x="760" y="72" fill="#6b6b78" font-size="12" font-weight="700" letter-spacing="2">TWO APPROVALS, NEVER ONE</text><rect width="448" height="66" x="760" y="88" fill="#12121b" stroke="#2b2b3a" rx="10"/><circle cx="788" cy="121" r="13" fill="#1e293b" stroke="#7dd3fc"/><text x="788" y="126" fill="#7dd3fc" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="814" y="114" fill="#e4e4e7" font-size="15" font-weight="600">The work</text><text x="814" y="136" fill="#8b8b96" font-size="13">one immutable request snapshot, never future calls</text><rect width="448" height="66" x="760" y="164" fill="#12121b" stroke="#2b2b3a" rx="10"/><circle cx="788" cy="197" r="13" fill="#1e293b" stroke="#a78bfa"/><text x="788" y="202" fill="#a78bfa" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="814" y="190" fill="#e4e4e7" font-size="15" font-weight="600">The payment</text><text x="814" y="212" fill="#8b8b96" font-size="13">exact amount, exact recipient, live expiry</text><g font-size="13"><circle cx="770" cy="262" r="5" fill="#6ee7b7"/><text x="786" y="267" fill="#a1a1aa">Result and payment receipt, settlement confirmed from the ledger</text></g></g></svg>